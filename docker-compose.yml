services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-activity_saas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-activity_saas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./activity-saas-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4007
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-activity_saas}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting}
      CORS_ORIGINS: http://localhost:3007
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4007:4007"
    volumes:
      - uploads:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4007/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ./activity-saas-frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3007:80"

volumes:
  pgdata:
  uploads:
